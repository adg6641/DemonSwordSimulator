<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>루네아 · 애니메이션 미리보기</title>
<style>
:root{color-scheme:dark;--ink:#f2f3f7;--muted:#aebbc7;--line:#33494e;--teal:#abd7cf;--gold:#d7bf87}*{box-sizing:border-box}body{margin:0;background:#0c171d;color:var(--ink);font:15px 'Malgun Gothic',sans-serif}main{max-width:1250px;margin:0 auto;padding:30px 26px 42px}header{display:flex;justify-content:space-between;align-items:end;gap:22px;margin-bottom:24px}.eyebrow{color:var(--gold);font:12px Georgia,serif;letter-spacing:.24em}h1{font-size:34px;letter-spacing:-1px;margin:10px 0 6px}p{color:var(--muted);line-height:1.7;margin:4px 0}header .count{font-size:13px;color:var(--teal);white-space:nowrap}.panel{padding:18px;background:#14232b;border:1px solid var(--line);border-radius:14px;margin-bottom:16px}.controls{display:flex;flex-wrap:wrap;gap:11px;align-items:center}.controls+.controls{margin-top:14px}button,select,input{font:inherit}button,select{color:var(--ink);background:#20343d;border:1px solid #4b6069;border-radius:7px;padding:9px 12px}button{cursor:pointer}button:hover{background:#304c56}button.active{background:#315954;border-color:var(--teal)}select{max-width:100%}label{display:flex;gap:8px;align-items:center;color:#d0d9de;font-size:13px}input[type=range]{width:112px;accent-color:var(--teal)}input[type=checkbox]{accent-color:var(--teal)}.sep{width:1px;height:26px;background:var(--line);margin:0 3px}.stage{position:relative;border:1px solid #47636a;border-radius:14px;overflow:hidden;background:#213840}.stage canvas{width:100%;display:block}.badge{position:absolute;top:17px;left:19px;background:#11222be0;border:1px solid #54716b;border-radius:8px;padding:10px 14px;font-size:14px;pointer-events:none}.badge span{display:block;font-size:11px;color:var(--teal);margin-top:4px}.status{min-height:28px;color:#b8d3d3;padding:12px 2px;font-size:13px}.frames{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px}.frames button{padding:5px;border-color:#38535d;background:#172b34;overflow:hidden}.frames button.active{border-color:#e0cd9f;box-shadow:0 0 0 1px #e0cd9f}.frames canvas{display:block;width:100%}.frames small{display:block;color:#bfd3d5;font-size:11px;margin-top:3px}.links{display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;font-size:13px}a{color:#bddbd8}.hint{font-size:12px;margin-top:16px}.error{color:#ffbc9c}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#10212be8;z-index:3;color:#e4dbba}.loading[hidden]{display:none}@media(max-width:740px){main{padding:18px 12px}header{display:block}h1{font-size:27px}header .count{margin-top:12px}.frames{grid-template-columns:repeat(4,minmax(0,1fr))}.controls{gap:8px}select{max-width:290px}.sep{display:none}.panel{padding:12px}.badge{top:10px;left:10px;font-size:12px}}
</style></head><body><main>
<header><div><div class="eyebrow">LUNEA · MOONLIGHT COMPANION</div><h1>루네아 애니메이션</h1><p>동작 하나씩, 또는 이어지는 움직임으로 살펴보세요.</p></div><div class="count" id="count"></div></header>
<section class="panel"><div class="controls"><label>동작 <select id="clip" aria-label="개별 동작"></select></label><label>연결 보기 <select id="demo" aria-label="연속 동작"><option value="">개별 동작</option><option value="walk">천천히 걷고 멈추기</option><option value="run">달리고 멈추기</option><option value="jump">점프 → 낙하 → 착지</option><option value="crouch">웅크리기 → 대기 → 일어나기</option><option value="seal">마력 집중 → 봉인 발사 → 회복</option><option value="barrier">달빛 보호막</option><option value="heal">별빛 회복</option><option value="react">인사 → 놀람 → 균형 회복</option><option value="all">모든 캐릭터 동작 이어 보기</option></select></label><button id="replay">처음부터</button></div>
<div class="controls"><button id="play">일시 정지</button><button id="prev">◀ 한 프레임</button><button id="next">한 프레임 ▶</button><span class="sep"></span><label>속도 <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"><span id="speedLabel">1×</span></label><label>크기 <input id="zoom" type="range" min="0.8" max="1.9" step="0.1" value="1.6"></label><label><input id="flip" type="checkbox">왼쪽</label><label><input id="fx" type="checkbox" checked>이펙트</label><label><input id="guide" type="checkbox">바닥 기준선</label><label><input id="background" type="checkbox" checked>숲 배경</label></div></section>
<section class="stage"><div class="badge" id="badge">준비 중<span>이미지를 불러오고 있습니다.</span></div><div class="loading" id="loading">루네아의 동작을 불러오는 중…</div><canvas id="stage" width="1152" height="720" aria-label="루네아 애니메이션"></canvas></section>
<div class="status" id="status" role="status"></div><section class="frames" id="frames" aria-label="프레임 목록"></section>
<div class="links"><a id="sheet" href="#">현재 PNG 시트 열기</a><a href="animations.json">동작·프레임 정보</a><a href="생성_프롬프트.json">이미지 생성 기록</a></div><p class="hint">투명 PNG · 한 칸 384 × 384 · 4열 · 제자리 동작. 연결 보기에서는 이동·점프 높이와 별도 이펙트도 함께 표시합니다.</p>
</main><script src="preview-data.js"></script><script>
'use strict';
const data=window.LUNEA_DATA,$=id=>document.getElementById(id),clips=Object.fromEntries(data.clips.map(c=>[c.id,c])),images={},canvas=$('stage'),ctx=canvas.getContext('2d');
const sequences={walk:['idle_breathe','move_start','walk','walk','walk','move_stop','idle_breathe'],run:['idle_breathe','move_start','run','run','run','move_stop','idle_breathe'],jump:['idle_breathe','jump_takeoff','jump_air','land_soft','idle_breathe'],crouch:['idle_breathe','crouch_down','crouch_idle','crouch_idle','crouch_up','idle_breathe'],seal:['idle_breathe','skill_charge','skill_release','skill_recover','idle_breathe'],barrier:['idle_breathe','barrier_cast','idle_breathe'],heal:['idle_breathe','barrier_cast','idle_breathe'],react:['idle_breathe','greet','surprise','hurt_recover','idle_breathe'],all:data.clips.filter(c=>c.kind==='character').map(c=>c.id)};
sequences.all=['walk','run','jump','crouch','seal','barrier','react'].flatMap(key=>sequences[key]);
const state={id:'idle_breathe',frame:0,playing:true,elapsed:0,last:0,sequence:[],sequenceIndex:0,sceneTime:0,ready:false};
const forest=new Image();forest.src='../../world/02_숲_초입/뒷배경.png';
for(const folder of [...new Set(data.clips.map(c=>c.folder))]){const g=document.createElement('optgroup');g.label=folder;for(const c of data.clips.filter(c=>c.folder===folder)){const o=document.createElement('option');o.value=c.id;o.textContent=c.label;g.append(o);}$('clip').append(g);}
$('count').textContent=`${data.statistics.characterClips}개 캐릭터 동작 · ${data.statistics.effectClips}개 이펙트 · ${data.statistics.totalFrames}프레임`;
function sync(){ $('play').textContent=state.playing?'일시 정지':'재생';}
function choose(id){state.id=id;state.frame=0;state.elapsed=0;$('clip').value=id;$('sheet').href=clips[id].file;buildFrames();}
function clearSequence(){state.sequence=[];state.sequenceIndex=0;$('demo').value='';}
function buildFrames(){
 const c=clips[state.id],im=images[state.id];$('frames').replaceChildren();
 for(let i=0;i<c.frameCount;i++){const b=document.createElement('button'),cv=document.createElement('canvas'),caption=document.createElement('small');cv.width=160;cv.height=160;caption.textContent=String(i+1).padStart(2,'0');b.append(cv,caption);b.title=(i+1)+'번 프레임';b.onclick=()=>{state.playing=false;state.frame=i;state.elapsed=i/c.fps;sync();draw();};$('frames').append(b);const tc=cv.getContext('2d');tc.imageSmoothingEnabled=true;tc.imageSmoothingQuality='high';if(im?.complete&&im.naturalWidth){const f=c.frames[i];tc.drawImage(im,f.x,f.yTop,384,384,0,0,160,160);}}
}
$('clip').onchange=()=>{clearSequence();choose($('clip').value);state.playing=true;sync();};
$('demo').onchange=()=>{state.sequence=sequences[$('demo').value]||[];state.sequenceIndex=0;choose(state.sequence[0]||state.id);state.playing=true;state.sceneTime=0;sync();};
$('play').onclick=()=>{if(!state.playing&&!state.sequence.length&&state.frame===clips[state.id].frameCount-1&&clips[state.id].playback!=='loop'){state.elapsed=0;state.frame=0;}state.playing=!state.playing;sync();};
$('replay').onclick=()=>{state.sequenceIndex=0;choose(state.sequence[0]||state.id);state.sceneTime=0;state.playing=true;sync();};
function step(d){state.playing=false;const c=clips[state.id];state.frame=(state.frame+d+c.frameCount)%c.frameCount;state.elapsed=state.frame/c.fps;sync();draw();}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('speed').oninput=()=>{$('speedLabel').textContent=$('speed').value+'×';};
function cel(id,f,x,y,s=1,alpha=1){const c=clips[id],im=images[id];if(!c||!im?.complete||!im.naturalWidth)return;const frame=c.frames[Math.max(0,Math.min(c.frameCount-1,f))];ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);if($('flip').checked)ctx.scale(-1,1);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(im,frame.x,frame.yTop,384,384,-c.pivot.x*s,-c.pivot.y*s,384*s,384*s);ctx.restore();}
function cover(im,x,y,w,h){const s=Math.max(w/im.naturalWidth,h/im.naturalHeight),iw=im.naturalWidth*s,ih=im.naturalHeight*s;ctx.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih);}
function draw(){
 const c=clips[state.id],frame=state.frame,p=frame/Math.max(1,c.frameCount-1),s=Number($('zoom').value),ground=642,x=430,dir=$('flip').checked?-1:1;
 ctx.clearRect(0,0,1152,720);
 if($('background').checked&&forest.complete&&forest.naturalWidth){cover(forest,0,0,1152,720);ctx.fillStyle='#0e222c2e';ctx.fillRect(0,0,1152,720);}else{ctx.fillStyle='#243a46';ctx.fillRect(0,0,1152,720);ctx.strokeStyle='#3c525d';for(let gx=0;gx<1152;gx+=48){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,720);ctx.stroke();}for(let gy=0;gy<720;gy+=48){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(1152,gy);ctx.stroke();}}
 const floor=ctx.createLinearGradient(0,590,0,720);floor.addColorStop(0,'#14242a00');floor.addColorStop(1,'#101f29ed');ctx.fillStyle=floor;ctx.fillRect(0,590,1152,130);
 const isMoving=c.id==='walk'||c.id==='run',scroll=isMoving?state.sceneTime*(c.id==='walk'?95:210)*dir:0;
 ctx.strokeStyle='#a9c4b41d';for(let gx=-100;gx<1252;gx+=80){const sx=gx-((scroll%80)+80)%80;ctx.beginPath();ctx.moveTo(sx,ground+15);ctx.lineTo(sx+17,ground+15);ctx.stroke();}
 let lift=0;if(state.sequence.length){if(c.id==='jump_takeoff')lift=Math.max(0,(p-.7)/.3)*40;if(c.id==='jump_air')lift=40+Math.sin(Math.PI*p)*155;if(c.id==='land_soft')lift=Math.max(0,1-p*5)*40;}
 ctx.fillStyle='#071b225a';ctx.beginPath();ctx.ellipse(x,ground+1,47-lift*.07,9-lift*.012,0,0,Math.PI*2);ctx.fill();
 if($('guide').checked){ctx.strokeStyle='#eed49e';ctx.setLineDash([7,6]);ctx.beginPath();ctx.moveTo(30,ground);ctx.lineTo(1122,ground);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#e4e6de';ctx.beginPath();ctx.moveTo(x-10,ground);ctx.lineTo(x+10,ground);ctx.moveTo(x,ground-10);ctx.lineTo(x,ground+10);ctx.stroke();}
 const fx=$('fx').checked,demo=$('demo').value;
 if(c.kind==='effect'){
  cel('idle_breathe',Math.floor(state.sceneTime*12)%16,x,ground,s);
  if(fx){
   if(c.id==='fx_heal')cel(c.id,frame,x,ground-90,1.1,.8);
   else if(c.id==='fx_barrier')cel(c.id,frame,x,ground-220,1.8,.55);
   else if(c.id==='fx_projectile')cel(c.id,frame,x+dir*(140+p*450),ground-218*s,.8,.85);
   else cel(c.id,frame,x+dir*150,ground-220*s,.72,.82);
  }
 }else{
  if(fx&&demo==='heal'&&c.id==='barrier_cast')cel('fx_heal',Math.min(15,frame),x,ground-90,1.1,.75);
  cel(c.id,frame,x,ground-lift,s);
  if(fx){
   if(c.id==='skill_charge'&&p>.35){const q=(p-.35)/.65,handX=200+q*70,handY=168-q*48;cel('fx_seal',Math.floor(q*7),x+dir*(handX-192)*s,ground+(handY-320)*s,.36,.65);}
   if(c.id==='skill_release'){cel('fx_seal',Math.min(15,8+Math.floor(p*8)),x+dir*78*s,ground-202*s,.44,.7);if(p>.12){const q=(p-.12)/.88;cel('fx_projectile',Math.min(15,Math.floor(q*16)),x+dir*(118*s+q*470),ground-202*s,.76,.85);}}
   if(c.id==='barrier_cast'&&p>.2&&demo!=='heal')cel('fx_barrier',Math.floor((p-.2)/.8*15),x,ground-218,1.8,.55);
  }
 }
 const label=state.sequence.length?'연결 보기 · '+$('demo').selectedOptions[0].textContent:'개별 동작';
 $('badge').replaceChildren(document.createTextNode(c.label));const sub=document.createElement('span');sub.textContent=label;$('badge').append(sub);
 $('status').textContent=`${c.label}  ·  ${frame+1} / ${c.frameCount} 프레임  ·  ${c.fps} FPS  ·  ${c.playback==='loop'?'반복 동작':'한 번 재생'}${state.playing?'':'  ·  정지'}`;
 [...$('frames').children].forEach((b,i)=>b.classList.toggle('active',i===frame));
}
function tick(t){
 const dt=Math.min(.05,(t-(state.last||t))/1000);state.last=t;
 if(state.ready&&state.playing){const d=dt*Number($('speed').value);state.elapsed+=d;state.sceneTime+=d;const c=clips[state.id],duration=c.frameCount/c.fps;
  if(state.elapsed>=duration){if(state.sequence.length){const remainder=state.elapsed-duration;state.sequenceIndex=(state.sequenceIndex+1)%state.sequence.length;choose(state.sequence[state.sequenceIndex]);state.elapsed=remainder;}else if(c.playback==='loop')state.elapsed%=duration;else{state.elapsed=(c.frameCount-1)/c.fps;state.playing=false;sync();}}
  const active=clips[state.id];state.frame=Math.min(active.frameCount-1,Math.floor(state.elapsed*active.fps));
 }
 draw();requestAnimationFrame(tick);
}
async function load(){
 let complete=0;const errors=[];await Promise.all(data.clips.map(c=>new Promise(resolve=>{const im=new Image();images[c.id]=im;im.onload=()=>{complete++;$('loading').textContent=`동작 불러오는 중 · ${complete} / ${data.clips.length}`;resolve();};im.onerror=()=>{errors.push(c.file);resolve();};im.src=c.file+'?v=20261105-1';})));
 $('loading').hidden=true;state.ready=true;choose('idle_breathe');if(errors.length){$('status').classList.add('error');$('status').textContent='불러오지 못한 이미지: '+errors.join(', ');state.playing=false;throw Error('이미지 로드 오류: '+errors.join(','));}sync();
}
window.LUNEA_PREVIEW={state,clips,images,choose,draw};load();requestAnimationFrame(tick);
</script></body></html>
