<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>밤의 도감 · 몬스터 애니메이션</title>
<style>
:root{color-scheme:dark;--bg:#0b141b;--panel:#14212a;--line:#2a3d46;--ink:#e9e6d9;--muted:#9aafb5;--gold:#e3bb78;--mint:#94d6c0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",sans-serif}button,select,input{font:inherit}button,a,select{touch-action:manipulation}button,select{color:var(--ink);background:#1a2c36;border:1px solid var(--line);border-radius:9px;padding:9px 13px}button{cursor:pointer}button:hover,button.active{border-color:var(--gold);background:#344038;color:#ffe3ae}a{color:var(--mint)}header{max-width:1600px;margin:auto;padding:30px 28px 20px;display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--gold)}h1{font-size:29px;letter-spacing:-1px;margin:8px 0}header p{margin:0;font-size:13px;color:var(--muted);line-height:1.8}.stats{font-size:14px;color:var(--gold);white-space:nowrap}.layout{max-width:1600px;margin:auto;padding:0 28px 30px;display:grid;grid-template-columns:340px 1fr;gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}.sidebar{align-self:start}.filters{padding:14px;display:flex;flex-wrap:wrap;gap:7px}.filters button{font-size:12px;padding:7px 10px}.list{padding:0 10px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:780px;overflow:auto}.monster{padding:8px 5px;border-radius:10px;text-align:center;background:#101d25;min-height:148px}.monster img{width:100%;height:104px;object-fit:contain;image-rendering:pixelated}.monster strong{display:block;font-size:12px;line-height:1.6}.monster small{display:block;color:var(--muted);font-size:10px;line-height:1.6}.viewer-head{padding:19px 22px 15px;display:flex;justify-content:space-between;gap:20px;align-items:start}h2{font-size:23px;margin:5px 0 7px}.tag{font-size:11px;color:var(--gold)}.story{font-size:13px;line-height:1.8;color:#b8c8c8;margin:0;max-width:720px}.stage-wrap{position:relative;background:#10212c;border-block:1px solid var(--line)}#stage{display:block;width:100%;aspect-ratio:1080/470;image-rendering:pixelated}.badge{position:absolute;left:17px;top:14px;background:#0d1920cc;border:1px solid #52645c80;border-radius:8px;padding:7px 10px;font-size:11px;color:#d3ddcf}.controls{padding:16px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.controls label{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}.controls input[type=range]{width:105px;accent-color:var(--gold)}.actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 14px}.actions button{font-size:12px}.timeline{padding:0 20px 17px;display:flex;gap:8px;align-items:center}.timeline input{flex:1;accent-color:var(--gold)}#frameLabel{font-size:12px;min-width:95px;color:var(--muted)}.detail{border-top:1px solid var(--line);padding:17px 20px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.detail p{font-size:12px;line-height:1.8;margin:5px 0;color:var(--muted)}.detail strong{font-size:12px;color:var(--gold)}#phase{color:var(--mint)}.thumbs{display:flex;overflow-x:auto;gap:8px;padding:0 20px 20px}.thumbs button{padding:3px;flex:0 0 88px;background:#0c1820}.thumbs canvas{width:80px;height:80px;display:block;image-rendering:pixelated}.thumbs small{font-size:10px;display:block;padding:2px}.foot{font-size:11px;color:var(--muted);padding:0 20px 18px;line-height:1.9}.state-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mint);margin-right:5px}#loadStatus.error{color:#ffad9e}.shortcut{font-size:11px;color:var(--muted);padding:0 15px 14px;line-height:1.9}@media(max-width:1000px){.layout{grid-template-columns:240px 1fr;padding:0 14px 20px;gap:12px}header{padding:22px 15px}.monster{min-height:130px}.monster img{height:84px}.viewer-head{padding:15px}.controls{padding:12px}h2{font-size:20px}.detail{grid-template-columns:1fr;gap:10px}}@media(max-width:740px){.layout{display:flex;flex-direction:column}.sidebar{width:100%}.list{display:flex;overflow-x:auto;max-height:190px}.monster{flex:0 0 130px}.filters{padding:10px}.shortcut{display:none}header{align-items:start}.stats{font-size:11px;white-space:normal;text-align:right}.controls label{font-size:11px}.detail{padding:14px}.story{font-size:12px}}
</style></head><body>
<header><div><div class="eyebrow">DARK SWORD SIMULATOR · BESTIARY</div><h1>밤의 도감</h1><p>적을 고르고 동작을 눌러보세요. 한 장씩 멈춰 보거나 공격의 흐름을 이어서 볼 수 있습니다.</p></div><div class="stats" id="stats"></div></header>
<main class="layout"><aside class="panel sidebar"><div class="filters" id="filters"></div><div class="list" id="monsters"></div><div class="shortcut">Space 재생/정지 · ← → 한 프레임<br>위·아래 목록 키 대신 몬스터를 클릭하세요.</div></aside>
<section class="panel"><div class="viewer-head"><div><span class="tag" id="region"></span><h2 id="name"></h2><p class="story" id="story"></p></div><a href="몬스터_전체_도감.png" target="_blank" style="font-size:12px;white-space:nowrap">전체 도감 ↗</a></div>
<div class="stage-wrap"><canvas id="stage" width="1080" height="470"></canvas><div class="badge" id="loadStatus">이미지 준비 중</div></div>
<div class="controls"><button id="play">일시 정지</button><button id="previous">◀ 한 장</button><button id="next">한 장 ▶</button><button id="demo">동작 이어보기</button><label><input type="checkbox" id="repeat" checked>반복</label><label><input type="checkbox" id="flip">오른쪽 보기</label><label>속도 <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"><span id="speedValue">1×</span></label><label>확대 <input id="zoom" type="range" min="0.7" max="1.3" step="0.1" value="1"></label><select id="background" aria-label="배경"><option value="auto">지역 배경</option><option value="forest">숲</option><option value="ruins">폐허</option><option value="castle">마왕성</option><option value="checker">투명 배경 확인</option></select></div>
<div class="actions" id="actions"></div><div class="timeline"><input type="range" id="scrub" min="0" max="3" value="0" step="1" aria-label="현재 프레임"><span id="frameLabel"></span></div>
<div class="detail"><div><strong id="motionName"></strong><p id="phase"></p><p id="info"></p></div><div><strong>이 몬스터의 공격</strong><p id="attacks"></p><p><a id="sheetLink" href="#" target="_blank">현재 동작의 원본 PNG 시트 열기 ↗</a></p></div></div><div class="thumbs" id="thumbs"></div>
<div class="foot"><span class="state-dot"></span>투명 PNG 스프라이트 · 기본 방향은 왼쪽 · 공격 전 준비 → 타격 → 회복<br>현재는 이미지와 모션 확인 단계입니다. 전투 AI·이동 거리·피해 판정은 게임에 연결할 때 적용합니다.</div></section></main>
<script src="preview-data.js"></script><script>
'use strict';
const M=window.ENEMY_ANIMATIONS,$=id=>document.getElementById(id),canvas=$('stage'),ctx=canvas.getContext('2d');
const clips=Object.fromEntries(M.clips.map(c=>[c.id,c])),images=new Map(),backgrounds=new Map();
const S={actor:M.actors[0],clip:null,time:0,frame:0,playing:true,sequence:false,sequenceIndex:0,filter:'전체',last:0,loadToken:0};
const bgFiles={forest:'_preview/bg_forest.jpg',ruins:'_preview/bg_ruins.jpg',castle:'_preview/bg_castle.jpg'};
function loadImage(file){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error(file));im.src=encodeURI(file)+'?v=20261105';});}
for(const [key,file] of Object.entries(bgFiles))loadImage(file).then(im=>backgrounds.set(key,im)).catch(()=>{});
let hero=null;loadImage('_preview/hero.png').then(im=>hero=im).catch(()=>{});
function getActorClips(){return S.actor.clips.map(id=>clips[id]);}
function renderList(){
 $('monsters').replaceChildren();
 for(const a of M.actors.filter(a=>S.filter==='전체'||a.category===S.filter)){
  const b=document.createElement('button');b.className='monster'+(a.id===S.actor.id?' active':'');b.title=a.story;
  const im=document.createElement('img');im.src=encodeURI(a.thumbnail);im.alt=a.name;im.loading='lazy';b.append(im);
  const name=document.createElement('strong');name.textContent=a.name;b.append(name);const sub=document.createElement('small');sub.textContent=a.category+' · '+a.clips.length+'개 동작';b.append(sub);
  b.onclick=()=>selectActor(a.id);$('monsters').append(b);
 }
}
function renderFilters(){
 $('filters').replaceChildren();for(const category of ['전체',...new Set(M.actors.map(a=>a.category))]){const b=document.createElement('button');b.textContent=category;b.className=category===S.filter?'active':'';b.onclick=()=>{S.filter=category;renderFilters();renderList();};$('filters').append(b);}
}
async function selectActor(id){
 S.actor=M.actors.find(a=>a.id===id);S.sequence=false;S.playing=true;images.clear();const token=++S.loadToken;
 $('name').textContent=S.actor.name;$('region').textContent=S.actor.category+' / '+S.actor.region;$('story').textContent=S.actor.story;
 $('attacks').textContent=getActorClips().filter(c=>c.state.startsWith('attack')).map(c=>c.label).join(' · ');
 renderList();renderActions();chooseClip(S.actor.id+'_idle');$('loadStatus').textContent='모션 이미지 불러오는 중';$('loadStatus').className='badge';
 const results=await Promise.allSettled(S.actor.sheets.map(async sheet=>{const im=await loadImage(sheet.file);if(token===S.loadToken)images.set(sheet.file,im);}));
 if(token!==S.loadToken)return;const failed=results.filter(r=>r.status==='rejected');$('loadStatus').textContent=failed.length?'이미지 경로 확인 필요':'투명 PNG · '+S.actor.sheets.length+'장 로드 완료';if(failed.length)$('loadStatus').className='badge error';renderThumbnails();
}
function renderActions(){
 $('actions').replaceChildren();for(const c of getActorClips()){const b=document.createElement('button');b.textContent=c.label;b.dataset.clip=c.id;b.onclick=()=>{S.sequence=false;chooseClip(c.id);};$('actions').append(b);}
}
function chooseClip(id,keepSequence=false){
 S.clip=clips[id];S.time=0;S.frame=0;if(!keepSequence)S.sequence=false;
 $('scrub').max=S.clip.frameCount-1;$('scrub').value=0;$('sheetLink').href=encodeURI(S.clip.file);$('motionName').textContent=S.clip.label;
 for(const b of $('actions').children)b.classList.toggle('active',b.dataset.clip===id);
 $('demo').classList.toggle('active',S.sequence);renderThumbnails();updateLabels();
}
function updateLabels(){
 const c=S.clip;if(!c)return;$('frameLabel').textContent=(S.frame+1)+' / '+c.frameCount+' 프레임';$('scrub').value=S.frame;
 $('info').textContent=c.frameWidth+'×'+c.frameHeight+' 칸 · '+c.fps+'fps · '+(c.playback==='loop'?'반복 동작':'한 번 동작');
 let phase='';if(c.phases){const p=c.phases;phase=S.frame<=p.telegraph[1]?'① 공격 전 준비':S.frame<=p.active[1]?'② 타격 자세':'③ 힘을 거두고 회복';}else phase=c.state==='defeat'?'마지막 자세에서 멈추는 패배 동작':c.state==='hurt'?'충격을 받고 원래 자세로 돌아오기':'같은 크기를 유지하며 제자리에서 반복';
 $('phase').textContent=phase;$('play').textContent=S.playing?'일시 정지':'다시 재생';
}
function renderThumbnails(){
 $('thumbs').replaceChildren();const c=S.clip,im=c&&images.get(c.file);if(!im)return;
 for(let i=0;i<c.frameCount;i++){const b=document.createElement('button'),thumb=document.createElement('canvas');thumb.width=128;thumb.height=128;const t=thumb.getContext('2d'),f=c.frames[i];t.imageSmoothingEnabled=false;t.drawImage(im,f.x,f.yTop,f.width,f.height,0,0,128,128);b.append(thumb);const label=document.createElement('small');label.textContent=(i+1)+'번';b.append(label);b.onclick=()=>{S.playing=false;S.sequence=false;S.frame=i;S.time=i/c.fps;updateLabels();};$('thumbs').append(b);}
}
function demoStates(){return ['idle','move','attack_a','idle','attack_b',...(S.actor.boss?['idle','attack_c']:[]),'hurt','idle','defeat'];}
function advance(dt){
 if(!S.playing||!S.clip||!images.has(S.clip.file))return;const c=S.clip;S.time+=dt*Number($('speed').value);
 const duration=S.sequence&&c.state==='idle'?0.9:S.sequence&&c.state==='move'?1.1:c.frameCount/c.fps+(S.sequence&&c.state==='defeat'?0.9:0);
 if(S.sequence&&S.time>=duration){S.sequenceIndex=(S.sequenceIndex+1)%demoStates().length;chooseClip(S.actor.id+'_'+demoStates()[S.sequenceIndex],true);}
 else if(S.time>=c.frameCount/c.fps){if(S.sequence&&c.playback==='once'){S.frame=c.frameCount-1;}else if(c.playback==='loop'||$('repeat').checked){S.frame=Math.floor(S.time*c.fps)%c.frameCount;}else{S.frame=c.frameCount-1;S.playing=false;}}
 else S.frame=Math.min(c.frameCount-1,Math.floor(S.time*c.fps));updateLabels();
}
function bgKey(){let k=$('background').value;if(k!=='auto')return k;const n=S.actor.index;return n===16||n<=6?'forest':n===17||n<=10?'ruins':'castle';}
function draw(){
 const w=canvas.width,h=canvas.height,key=bgKey();ctx.clearRect(0,0,w,h);ctx.imageSmoothingEnabled=false;
 if(key==='checker'){for(let y=0;y<h;y+=24)for(let x=0;x<w;x+=24){ctx.fillStyle=(x/24+y/24)%2?'#26343c':'#1c2a32';ctx.fillRect(x,y,24,24);}}
 else{ctx.fillStyle=key==='castle'?'#1a1723':key==='ruins'?'#202c30':'#18302b';ctx.fillRect(0,0,w,h);const bg=backgrounds.get(key);if(bg){const sw=bg.naturalWidth,sh=bg.naturalHeight,fit=Math.max(w/sw,h/sh);ctx.drawImage(bg,0,(h-sh*fit)*0.6,sw*fit,sh*fit);}ctx.fillStyle='#07131b63';ctx.fillRect(0,0,w,h);}
 const ground=398;ctx.fillStyle='#101b1ce8';ctx.fillRect(0,ground,w,h-ground);ctx.fillStyle='#84967d80';ctx.fillRect(0,ground,w,2);
 if(hero){ctx.globalAlpha=.85;const scale=1;ctx.drawImage(hero,190-192*scale,ground-320*scale,384*scale,384*scale);ctx.globalAlpha=1;ctx.font='12px "Malgun Gothic"';ctx.fillStyle='#bcc9bf';ctx.textAlign='center';ctx.fillText('주인공 크기 참고',190,434);}
 const c=S.clip,im=c&&images.get(c.file);if(!im)return;const f=c.frames[S.frame],zoom=Number($('zoom').value),scale=1.05*zoom,rootX=660;
 ctx.save();ctx.translate(rootX,ground);if($('flip').checked)ctx.scale(-1,1);ctx.drawImage(im,f.x,f.yTop,f.width,f.height,-c.pivot.x*scale,-c.pivot.y*scale,f.width*scale,f.height*scale);ctx.restore();
 ctx.textAlign='center';ctx.font='12px "Malgun Gothic"';ctx.fillStyle='#d9d4bc';ctx.fillText(c.label,rootX,434);
}
function frame(now){const dt=S.last?Math.min((now-S.last)/1000,.1):0;S.last=now;advance(dt);draw();requestAnimationFrame(frame);}
$('play').onclick=()=>{S.playing=!S.playing;updateLabels();};
function step(n){S.playing=false;S.sequence=false;S.frame=(S.frame+n+S.clip.frameCount)%S.clip.frameCount;S.time=S.frame/S.clip.fps;updateLabels();}
$('previous').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('scrub').oninput=()=>{S.playing=false;S.sequence=false;S.frame=Number($('scrub').value);S.time=S.frame/S.clip.fps;updateLabels();};
$('demo').onclick=()=>{S.sequence=true;S.sequenceIndex=0;S.playing=true;chooseClip(S.actor.id+'_idle',true);};$('speed').oninput=()=>{$('speedValue').textContent=$('speed').value+'×';};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();$('play').onclick();}else if(e.code==='ArrowRight'){e.preventDefault();step(1);}else if(e.code==='ArrowLeft'){e.preventDefault();step(-1);}});
$('stats').textContent=M.statistics.characters+'종 · '+M.statistics.attackPatterns+'가지 공격 · '+M.statistics.totalFrames+'프레임';renderFilters();selectActor(S.actor.id);requestAnimationFrame(frame);
window.enemyPreview={state:S,chooseClip,selectActor,advance,draw,step,images,clips,demoStates};
</script></body></html>
