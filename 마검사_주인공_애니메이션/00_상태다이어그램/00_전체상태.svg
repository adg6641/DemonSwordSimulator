<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1520" viewBox="0 0 2400 1520"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8069b3"/></marker></defs><rect width="100%" height="100%" fill="#f6f7fc"/><style>text{font-family:'Malgun Gothic',sans-serif;fill:#1e2031}.title{font-size:54px;font-weight:bold}.sub{font-size:27px;fill:#626579}.label{font-size:31px;font-weight:bold}.small{font-size:25px;fill:#4c5067}.node{fill:#fff;stroke:#c8c5dd;stroke-width:2}.trans{fill:#eee8fa;stroke:#b39dd8;stroke-width:2}.line{fill:none;stroke:#8069b3;stroke-width:3;marker-end:url(#arrow)}</style><text x="72" y="100" class="title">마검사 주인공 상태 다이어그램</text><text x="72" y="153" class="sub">큰 상태 안에서 기본 동작과 연결 동작을 순서대로 재생합니다</text><path class="line" d="M1150 540V385H870"/><path class="line" d="M1250 540V385H1530"/><path class="line" d="M1000 650H685V965"/><path class="line" d="M1400 650H1715V965"/><path class="line" d="M1715 1180V1220H1200V1260"/><rect x="1000" y="540" width="400" height="180" rx="12" class="node"/><text x="1200" y="588" text-anchor="middle" class="label">지상 기본 상태</text><text x="1200" y="631" text-anchor="middle" class="small">대기 · 걷기 · 달리기</text><rect x="270" y="270" width="600" height="215" rx="12" class="node"/><text x="570" y="318" text-anchor="middle" class="label">점프와 공중 동작</text><text x="570" y="361" text-anchor="middle" class="small">이륙 · 상승 · 최고점 · 낙하 · 착지</text><rect x="1530" y="270" width="600" height="215" rx="12" class="node"/><text x="1830" y="318" text-anchor="middle" class="label">웅크리기와 대시</text><text x="1830" y="361" text-anchor="middle" class="small">낮추기 · 유지 · 이동 · 종료</text><rect x="270" y="965" width="650" height="215" rx="12" class="node"/><text x="595" y="1013" text-anchor="middle" class="label">공격과 마법</text><text x="595" y="1056" text-anchor="middle" class="small">3연속 베기 · 강공격 · 특수 공격</text><rect x="1480" y="965" width="650" height="215" rx="12" class="node"/><text x="1805" y="1013" text-anchor="middle" class="label">방어와 피격</text><text x="1805" y="1056" text-anchor="middle" class="small">방어 · 충격 흡수 · 넘어짐 · 회복</text><text x="1200" y="786" text-anchor="middle" class="label">행동이 끝나면 이동 입력에 맞는 기본 상태로 복귀</text><text x="1200" y="841" text-anchor="middle" class="small">점프 중에는 공중 공격·공중 대시를 사용하고, 끝나면 낙하 상태로 연결</text><rect x="1000" y="1260" width="400" height="120" rx="12" class="trans"/><text x="1200" y="1308" text-anchor="middle" class="label">체력 0이면 패배</text><text x="1200" y="1351" text-anchor="middle" class="small">death 마지막 프레임 유지</text><text x="72" y="1430" class="small">키: 방향키 이동 / Space 점프 / Shift 대시 / Ctrl 웅크리기 / C 공격 / X 방어 / Z 마법</text><text x="72" y="1481" class="small">피격은 반응을 빠르게 보여 주기 위해 즉시 전환합니다. 대시·공격 무적 여부와 입력 우선순위는 게임 코드에서 결정합니다.</text></svg>